<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Colors</title>
<link rel="stylesheet" href="style.css?v=canvas-zoom-1">
</head>
<body>
<header>
  <div class="brand">🎨 Happy Colors <small class="build-tag">Canvas zoom 1</small></div>
  <div class="top-actions">
    <button id="undoBtn" type="button" aria-label="Undo" title="Undo"><span class="action-icon" aria-hidden="true">↩️</span> <span class="action-text">Undo</span></button>
    <button id="redoBtn" type="button" aria-label="Redo" title="Redo"><span class="action-icon" aria-hidden="true">↪️</span> <span class="action-text">Redo</span></button>
    <button id="newBtn" type="button" aria-label="New" title="New"><span class="action-icon" aria-hidden="true">✨</span> <span class="action-text">New</span></button>
    <button id="saveBtn" class="primary" type="button" aria-label="Save" title="Save"><span class="action-icon" aria-hidden="true">💾</span> <span class="action-text">Save</span></button>
  </div>
</header>

<main>
<aside class="tools">
  <section>
    <h2>Colors</h2>
    <div id="palette" class="palette"></div>
    <label class="custom-color">More <input id="colorPicker" type="color" value="#ff4f87"></label>
  </section>

  <section>
    <h2>Brush Size</h2>
    <div class="brushes">
      <button class="brush active" data-size="8">S</button>
      <button class="brush" data-size="16">M</button>
      <button class="brush" data-size="28">L</button>
      <button class="brush" data-size="44">XL</button>
    </div>
  </section>

  <section class="tool-buttons">
    <button id="brushBtn" class="active">🖌️ Brush</button>
    <button id="sparkleBtn">✨ Sparkle</button>
    <button id="bucketBtn">🪣 Fill</button>
    <button id="outlineBtn">✏️ Draw Picture</button>
    <button id="eraserBtn">🧽 Eraser</button>
    <button id="clearBtn">🗑️ Clear</button>
  </section>

  <section>
    <h2>Coloring Pages</h2>
    <div class="pages">
      <button class="pageBtn" data-page="blank">⬜ Blank</button>
      <button class="pageBtn" data-page="unicorn">🦄 Unicorn</button>
      <button class="pageBtn" data-page="princess">👸 Princess</button>
      <button class="pageBtn" data-page="cat">🐱 Cat</button>
      <button class="pageBtn" data-page="butterfly">🦋 Butterfly</button>
      <button class="pageBtn" data-page="dino">🦖 Dinosaur</button>
    </div>
  </section>

  <section>
    <h2>Stickers</h2>
    <div id="stickers" class="stickers">
      <button data-sticker="⭐">⭐</button>
      <button data-sticker="🌈">🌈</button>
      <button data-sticker="❤️">❤️</button>
      <button data-sticker="🌸">🌸</button>
      <button data-sticker="🦄">🦄</button>
      <button data-sticker="👑">👑</button>
      <button data-sticker="🦋">🦋</button>
      <button data-sticker="✨">✨</button>
    </div>
    <div class="tiny">Pick a sticker, then tap the picture.</div>
  </section>

  <section class="background-section">
    <h2>Background</h2>
    <div class="backgrounds">
      <button class="bg active" data-bg="#ffffff">⬜ White</button>
      <button class="bg" data-bg="#fff7df">🌤️ Cream</button>
      <button class="bg" data-bg="#dff5ff">☁️ Sky</button>
      <button class="bg" data-bg="#ffe5ef">🌸 Pink</button>
    </div>

    <label class="upload-control" for="imageUpload">
      <span>🖼️ Upload Picture</span>
      <input id="imageUpload" type="file" accept="image/*">
    </label>
  </section>
</aside>

<section class="canvas-wrap">
  <div class="canvas-view-tools" role="group" aria-label="Canvas zoom controls">
    <button id="zoomOutBtn" type="button" aria-label="Zoom canvas out" title="Zoom out">−</button>
    <output id="zoomLabel" aria-label="Canvas zoom level">100%</output>
    <button id="zoomInBtn" type="button" aria-label="Zoom canvas in" title="Zoom in">+</button>
    <button id="zoomFitBtn" type="button" title="Show the whole picture">Fit</button>
  </div>
  <div class="canvas-board">
    <div class="canvas-stage" id="canvasViewport" tabindex="0" role="region" aria-label="Drawing area: one finger to draw, two fingers to zoom and move">
      <div id="canvasSurface" class="canvas-surface">
        <canvas id="canvas" aria-label="Drawing canvas"></canvas>
      </div>
    </div>
    <input id="panY" class="pan-scroll pan-scroll-y" type="range" min="0" max="0" value="0" step="1" aria-label="Scroll canvas vertically" disabled>
    <input id="panX" class="pan-scroll pan-scroll-x" type="range" min="0" max="0" value="0" step="1" aria-label="Scroll canvas horizontally" disabled>
  </div>
  <div class="hint">One finger: draw · Two fingers: zoom &amp; move · Fit: whole picture</div>
</section>
</main>

<div id="confirmModal" class="modal hidden">
  <div class="dialog">
    <div class="big">🎨</div>
    <h3>Start a new picture?</h3>
    <p>Your current drawing will be cleared.</p>
    <button id="cancelNew">Keep drawing</button>
    <button id="confirmNew" class="danger">Start new</button>
  </div>
</div>

<script src="canvas-zoom.js?v=canvas-zoom-1"></script>
<script src="app.js?v=canvas-zoom-1"></script>
</body>
</html>
